apiVersion: apps/v1
kind: Deployment
metadata:
  name: account
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account
  template:
    metadata:
      labels:
        app: account
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
      - name: account
        image: store/account-service:dev
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        - name: management
          containerPort: 9091
        envFrom:
        - configMapRef:
            name: account-config
        - secretRef:
            name: account-secrets
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            cpu: 1000m
            memory: 768Mi
        # Overview.md: the orchestrator's probes call GET /accounts/health-check.
        startupProbe:
          httpGet:
            path: /accounts/health-check
            port: http
          timeoutSeconds: 3
          failureThreshold: 60
          periodSeconds: 5
        # Same threads as the traffic: generous timeout so a busy pod is not restarted under load.
        livenessProbe:
          httpGet:
            path: /accounts/health-check
            port: http
          timeoutSeconds: 5
          failureThreshold: 4
          periodSeconds: 15
        # Readiness stays on the actuator: it goes OUT_OF_SERVICE during graceful shutdown.
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: management
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: account
spec:
  type: ClusterIP
  selector:
    app: account
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: account-metrics
spec:
  selector:
    app: account
  ports:
  - name: management
    port: 9091
    targetPort: 9091
